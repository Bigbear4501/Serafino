# Serafino (b25): WirePlumber liest zusätzlich Einstellungen pro Konto aus
# /etc/serafino/pro-konto/BENUTZER/wireplumber/ – dort legt
# serafino-media-access.py für Kinder unter 10 eine Regel ab, die alle
# Mikrofone abschaltet. Der Ordner gehört root, Kinder können ihn nicht ändern.
[Service]
Environment=XDG_CONFIG_DIRS=/etc/serafino/pro-konto/%u:/etc/xdg
